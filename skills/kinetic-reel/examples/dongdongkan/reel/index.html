<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Kinetic reel · studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@500;700&family=Noto+Serif+SC:wght@500;700&display=block">
<style>
  html, body { margin: 0; background: #0e0f0e; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #000; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; } #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="36" step="0.0333" value="0"><span id="tt">loading…</span></div>
</main>
<script src="cues.js"></script>
<script type="module" src="reel.js"></script>
</body>
</html>
